        - input: $(params.deployenv)
          operator: in
          values:
            - dev
            - test
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: helm-upgrade-prod-from-source
      params:
        - name: charts_dir
          value: charts/bcbox
        - name: release_version
          value: ''
        - name: release_name
          value: bcstats-bcbox
        - name: release_namespace
          value: df9936-$(params.deployenv)
        - name: overwrite_values
          value: 'image.tag=$(params.imagetag),image.repository=image-registry.openshift-image-registry.svc:5000/df9936-tools,config.enabled=true,config.releaseScoped=true,config.configMap.FRONTEND_OIDC_AUTHORITY=https://loginproxy.gov.bc.ca/auth/realms/standard,config.configMap.FRONTEND_OIDC_CLIENTID=bc-stats-coms-bc-box-4936,config.configMap.FRONTEND_COMS_APIPATH=https://bcstatscoms.apps.gov.bc.ca/api/v1'
        - name: values_file
