        - name: upgrade_extra_params
          value: ''
      runAfter:
        - helm-dep-update2
      taskRef:
        kind: ClusterTask
        name: helm-upgrade-from-source
      when:
        - input: $(params.deployenv)
          operator: in
          values:
            - prod
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: helm-dep-update2
      runAfter:
        - buildah
      taskRef:
        kind: Task
        name: helm-dep-update2
      workspaces:
        - name: output
          workspace: shared-workspace
  workspaces:
    - name: shared-workspace
