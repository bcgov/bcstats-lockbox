          value: 'image.tag=$(params.imagetag),image.repository=image-registry.openshift-image-registry.svc:5000/df9936-tools,config.enabled=true,config.releaseScoped=true,config.configMap.FRONTEND_OIDC_AUTHORITY=https://$(params.deployenv).loginproxy.gov.bc.ca/auth/realms/standard,config.configMap.FRONTEND_OIDC_CLIENTID=bc-stats-coms-bc-box-4936,config.configMap.FRONTEND_COMS_APIPATH=https://bcstatscoms-$(params.deployenv).apps.gov.bc.ca/api/v1'
        - name: values_file
          value: values.yaml
        - name: helm_image
          value: 'docker.io/lachlanevenson/k8s-helm@sha256:5c792f29950b388de24e7448d378881f68b3df73a7b30769a6aa861061fd08ae'
        - name: upgrade_extra_params
          value: ''
      runAfter:
        - helm-dep-update2
      taskRef:
        kind: ClusterTask
